aid: duco
name: Duco
description: >-
  Duco is an AI-powered operational data automation platform for financial
  services. It helps banks, asset managers, brokers, asset servicers and market
  infrastructure firms normalize, validate and reconcile any data in the cloud —
  cutting the time spent on manual data work, reducing operational risk and
  accelerating front-, middle- and back-office processes. The no-code platform
  ingests data from any source (including unstructured documents via Adaptive
  Intelligent Document Processing), then transforms, matches, reconciles and
  publishes it with full audit and control. Duco's Agentic Workspace layers
  agentic AI over these operations so agents can handle repetitive extraction,
  matching and exception-labelling work under human oversight. Use cases span
  securities and derivatives reconciliation, ETD clearing, OTC confirmations,
  custody, cash accounts, crypto holdings and transaction/regulatory reporting
  (EMIR, CFTC, MiFID II, ASIC, MAS, T+1). Customers include HSBC, Deutsche Bank,
  ING, Santander, Northern Trust and Fidelity Digital Assets. Duco is backed by
  Insight Partners.
